[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adi-heston"
version = "0.1.0"
description = "ADI finite-difference methods for American options under the Heston model (Math/CS 714)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
